<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Fix for browser extensions that attempt to overwrite window.fetch
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _fetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            }
          });
        } catch (e) {
          // ignore
        }

        // Intercept and swallow errors originating from browser extensions
        window.addEventListener('error', function(e) {
          if ((e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e.message && e.message.indexOf('chrome-extension://') !== -1) ||
              (e.error && e.error.stack && e.error.stack.indexOf('chrome-extension://') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reasonStr = String((e.reason && (e.reason.stack || e.reason.message)) || e.reason || '');
          if (reasonStr.indexOf('chrome-extension://') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    <title>UNO Royale: 2-Player Duels</title>

  </body>
</html>
